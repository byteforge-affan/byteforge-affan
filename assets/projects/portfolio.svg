<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 176" width="700" height="176" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ByteForge Portfolio</title>
  <desc id="d">Developer Portfolio. Personal developer portfolio showcasing projects, capabilities and the ByteForge Studio identity. Built with HTML, CSS, JavaScript, Responsive Design.</desc>
  <defs>
    <clipPath id="c"><rect width="700" height="176" rx="12"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sc-cyan"/><stop offset="1" class="sc-teal"/></linearGradient>
    <radialGradient id="mg" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gm"><rect width="700" height="176" fill="url(#mg)"/></mask>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" class="scyan" stroke-opacity="0.22"/></pattern>
  </defs>
  <style>
:root{--panel:#0B1A2E;--panel2:#10253F;--line:#22405F;--text:#EAF3FF;--text2:#B7CBE2;--muted:#7F98B4;--cyan:#21C7E8;--teal:#2ECFC2;--gold:#FBC02D;--ink:#07111F}
@media (prefers-color-scheme:light){:root{--panel:#F7FBFF;--panel2:#E7F2FB;--line:#BFD5E8;--text:#0B1F36;--text2:#33506D;--muted:#5C7691;--cyan:#0794B5;--teal:#0B9488;--gold:#B37A00;--ink:#FFFFFF}}
.mono{font-family:@MONO@}.sans{font-family:@SANS@}
.fpanel{fill:var(--panel)}.fpanel2{fill:var(--panel2)}.sline{stroke:var(--line)}
.ftext{fill:var(--text)}.ftext2{fill:var(--text2)}.fmuted{fill:var(--muted)}
.fcyan{fill:var(--cyan)}.fteal{fill:var(--teal)}.fgold{fill:var(--gold)}.fink{fill:var(--ink)}
.scyan{stroke:var(--cyan)}.steal{stroke:var(--teal)}.sgold{stroke:var(--gold)}
.sc-cyan{stop-color:var(--cyan)}.sc-teal{stop-color:var(--teal)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:flow 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
  <g clip-path="url(#c)">
    <rect width="700" height="176" class="fpanel"/>
    <rect width="700" height="176" fill="url(#grid)" mask="url(#gm)"/>
    <rect width="3" height="176" fill="url(#bar)"/>
    <text x="672" y="150" text-anchor="end" class="mono scyan" font-size="84" font-weight="700" fill="none" stroke-width="1.2" stroke-opacity="0.35">01</text>
    <text x="28" y="36" class="mono" font-size="11" letter-spacing="2"><tspan class="fcyan">01</tspan><tspan class="fmuted">&#160;&#160;/&#160;&#160;DEVELOPER PORTFOLIO</tspan></text>
    <text x="28" y="74" class="sans ftext" font-size="26" font-weight="700" letter-spacing="-0.4">ByteForge Portfolio</text>
    <text x="28" y="100" class="sans ftext2" font-size="14">Personal developer portfolio showcasing projects,</text>
    <text x="28" y="120" class="sans ftext2" font-size="14">capabilities and the ByteForge Studio identity.</text>
    <rect x="28" y="136" width="50" height="24" rx="12" class="fpanel2 sline" stroke-width="1"/><text x="53.0" y="152" text-anchor="middle" class="mono ftext2" font-size="11.5">HTML</text>
    <rect x="86" y="136" width="43" height="24" rx="12" class="fpanel2 sline" stroke-width="1"/><text x="107.5" y="152" text-anchor="middle" class="mono ftext2" font-size="11.5">CSS</text>
    <rect x="137" y="136" width="92" height="24" rx="12" class="fpanel2 sline" stroke-width="1"/><text x="183.0" y="152" text-anchor="middle" class="mono ftext2" font-size="11.5">JavaScript</text>
    <rect x="237" y="136" width="141" height="24" rx="12" class="fpanel2 sline" stroke-width="1"/><text x="307.5" y="152" text-anchor="middle" class="mono ftext2" font-size="11.5">Responsive Design</text>
    <rect x="602" y="20" width="70" height="24" rx="12" fill="none" class="steal" stroke-width="1"/><circle cx="617" cy="32" r="3.5" class="fteal pulse"/><text x="629" y="36" class="mono fteal" font-size="11" font-weight="700" letter-spacing="1.5">LIVE</text>
  </g>
  <rect x="0.5" y="0.5" width="699" height="175" rx="12" fill="none" class="sline" stroke-width="1"/>
</svg>
