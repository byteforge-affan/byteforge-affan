<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ByteForge Studio — Muhammad Affan, Frontend-Focused Full-Stack Developer</title>
  <desc id="d">Terminal-style hero with a whoami prompt, name, role, tagline, a small profile code card and a status bar showing the current focus on PHP, MySQL and ASP.NET MVC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset="1" stop-color="#0A1E37"/></linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="480" y2="0"><stop offset="0" stop-color="#21C7E8"/><stop offset="1" stop-color="#2ECFC2"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#21C7E8" stop-opacity="0"/><stop offset="1" stop-color="#2ECFC2"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.05" r="0.7"><stop offset="0" stop-color="#21C7E8" stop-opacity="0.18"/><stop offset="1" stop-color="#21C7E8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#21C7E8" stroke-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="900" height="340" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    @keyframes rise{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .r{animation:rise .7s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
    .c1{animation-delay:1.0s}.c2{animation-delay:1.2s}.c3{animation-delay:1.4s}.c4{animation-delay:1.6s}.c5{animation-delay:1.8s}.c6{animation-delay:2.0s}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){.r,.pulse,.blink{animation:none}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="url(#bg)"/>
    <rect width="900" height="340" fill="url(#grid)"/>
    <rect width="900" height="340" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="900" height="40" fill="#050D18" fill-opacity="0.55"/>
    <path d="M0 40H900" stroke="#21C7E8" stroke-opacity="0.14" fill="none"/>
    <circle cx="24" cy="20" r="5" fill="#21C7E8" fill-opacity="0.9"/>
    <circle cx="44" cy="20" r="5" fill="#2ECFC2" fill-opacity="0.9"/>
    <circle cx="64" cy="20" r="5" fill="#FBC02D" fill-opacity="0.9"/>
    <text x="450" y="24" text-anchor="middle" class="mono" font-size="12" fill="#7F98B4">byteforge-studio — ~/muhammad-affan</text>

    <!-- identity -->
    <text x="48" y="94" class="mono r d1" font-size="14"><tspan fill="#2ECFC2">~/byteforge</tspan><tspan fill="#FBC02D">&#160;$</tspan><tspan fill="#E6F1FF">&#160;whoami</tspan><tspan fill="#21C7E8" class="blink">▌</tspan></text>
    <text x="48" y="170" class="sans r d2" font-size="50" font-weight="800" letter-spacing="-1.2" fill="#F2F8FF">Muhammad <tspan fill="url(#name)">Affan</tspan></text>
    <text x="48" y="208" class="sans r d3" font-size="24" font-weight="600" fill="#C4D7EC">Frontend-Focused Full-Stack Developer</text>
    <text x="48" y="238" class="mono r d3" font-size="14" fill="#8CA3BD"><tspan fill="#FBC02D">↳&#160;</tspan>Building modern websites &amp; practical web systems</text>
    <rect x="48" y="256" width="36" height="3" rx="1.5" fill="#FBC02D" class="r d4"/>
    <text x="48" y="284" class="mono r d4" font-size="12" fill="#7F98B4">modern interfaces · responsive experiences · practical web systems</text>

    <!-- code card -->
    <g class="r d2">
      <rect x="572" y="68" width="290" height="196" rx="10" fill="#050D18" fill-opacity="0.72" stroke="#21C7E8" stroke-opacity="0.26"/>
      <circle cx="592" cy="87" r="3" fill="#21C7E8"/>
      <text x="602" y="91" class="mono" font-size="11" fill="#7F98B4">profile.js</text>
      <path d="M572 104H862" stroke="#21C7E8" stroke-opacity="0.14" fill="none"/>
      <path d="M848 68h14v14" stroke="#FBC02D" stroke-opacity="0.9" stroke-width="1.5" fill="none"/>
    </g>
    <g class="mono" font-size="12">
      <g fill="#4F6882" font-size="11">
        <text x="590" y="128">1</text><text x="590" y="150">2</text><text x="590" y="172">3</text><text x="590" y="194">4</text><text x="590" y="216">5</text><text x="590" y="238">6</text>
      </g>
      <text x="614" y="128" class="r c1" fill="#7F98B4"><tspan fill="#21C7E8">const</tspan> <tspan fill="#EAF3FF">affan</tspan> = {</text>
      <text x="614" y="150" class="r c2" fill="#7F98B4">&#160;&#160;<tspan fill="#BFD3E8">role</tspan>: <tspan fill="#2ECFC2">"Full-Stack Developer"</tspan>,</text>
      <text x="614" y="172" class="r c3" fill="#7F98B4">&#160;&#160;<tspan fill="#BFD3E8">base</tspan>: <tspan fill="#2ECFC2">"Karachi, PK"</tspan>,</text>
      <text x="614" y="194" class="r c4" fill="#7F98B4">&#160;&#160;<tspan fill="#BFD3E8">now</tspan>: [<tspan fill="#2ECFC2">"PHP"</tspan>,<tspan fill="#2ECFC2">"MySQL"</tspan>,<tspan fill="#2ECFC2">"ASP.NET"</tspan>],</text>
      <text x="614" y="216" class="r c5" fill="#7F98B4">&#160;&#160;<tspan fill="#BFD3E8">next</tspan>: <tspan fill="#FBC02D">"Backend Architecture"</tspan>,</text>
      <text x="614" y="238" class="r c6" fill="#7F98B4">};</text>
    </g>

    <!-- status bar -->
    <rect y="300" width="900" height="40" fill="#050D18" fill-opacity="0.55"/>
    <path d="M0 300H900" stroke="#21C7E8" stroke-opacity="0.2" fill="none"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-140 0" to="900 0" dur="7s" repeatCount="indefinite"/>
      <rect x="0" y="299" width="140" height="2" fill="url(#tail)"/>
      <circle cx="140" cy="300" r="2.6" fill="#FBC02D"/>
    </g>
    <circle cx="54" cy="320" r="4" fill="#2ECFC2" class="pulse"/>
    <text x="68" y="324" class="mono" font-size="12"><tspan fill="#21C7E8" font-weight="700">BUILDING</tspan><tspan fill="#8CA3BD">&#160;&#160;·&#160;&#160;PHP · MySQL · ASP.NET MVC</tspan></text>
    <text x="852" y="324" text-anchor="end" class="mono" font-size="12" fill="#7F98B4">Karachi, Pakistan</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="none" stroke="#21C7E8" stroke-opacity="0.3"/>
</svg>
