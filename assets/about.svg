    <rect x="643" y="62" width="67" height="28" rx="14" class="fpanel2 sline" stroke-width="1"/><text x="676.5" y="80" text-anchor="middle" class="mono ftext2" font-size="13">MySQL</text>
    <rect x="718" y="62" width="122" height="28" rx="14" class="fpanel2 sline" stroke-width="1"/><text x="779.0" y="80" text-anchor="middle" class="mono ftext2" font-size="13">ASP.NET MVC</text>
