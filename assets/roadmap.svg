  <text x="24" y="134" class="sans ftext" font-size="19" font-weight="600">applications</text>
  <rect x="24" y="152" width="51" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="49.5" y="169" text-anchor="middle" class="mono ftext2" font-size="12">PHP</text><rect x="83" y="152" width="67" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="116.5" y="169" text-anchor="middle" class="mono ftext2" font-size="12">MySQL</text><rect x="158" y="152" width="122" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="219.0" y="169" text-anchor="middle" class="mono ftext2" font-size="12">ASP.NET MVC</text>

