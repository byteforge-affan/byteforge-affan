  <rect x="504" y="152" width="81" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="544.5" y="169" text-anchor="middle" class="mono ftext2" font-size="11.5" letter-spacing="1">BACKEND</text><rect x="593" y="152" width="96" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="641.0" y="169" text-anchor="middle" class="mono ftext2" font-size="11.5" letter-spacing="1">DATABASES</text><rect x="697" y="152" width="104" height="26" rx="13" class="fpanel2 sline" stroke-width="1"/><text x="749.0" y="169" text-anchor="middle" class="mono ftext2" font-size="11.5" letter-spacing="1">FULL-STACK</text>

