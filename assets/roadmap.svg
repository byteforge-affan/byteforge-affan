  <text x="53" y="36" text-anchor="middle" class="mono fink" font-size="12" font-weight="700" letter-spacing="1.5">NOW</text>
  <circle cx="98" cy="32" r="4" class="fteal pulse"/>
  <text x="110" y="36" class="mono fmuted" font-size="11">// current</text>
