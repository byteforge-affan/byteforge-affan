<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ByteForge Studio</title>
  <desc id="d">ByteForge Studio. Design, Develop, Build, Evolve. Modern websites, practical web systems, professional digital experiences. Built by Muhammad Affan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset="1" stop-color="#0A1E37"/></linearGradient>
    <linearGradient id="forge" gradientUnits="userSpaceOnUse" x1="368" y1="0" x2="480" y2="0"><stop offset="0" stop-color="#21C7E8"/><stop offset="1" stop-color="#2ECFC2"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#21C7E8" stop-opacity="0"/><stop offset="1" stop-color="#2ECFC2"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#21C7E8" stroke-opacity="0.06"/></pattern>
    <clipPath id="frame"><rect width="900" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){.blink{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="210" fill="url(#bg)"/>
    <rect width="900" height="210" fill="url(#grid)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-160 0" to="900 0" dur="9s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="160" height="2" fill="url(#tail)"/>
    </g>
    <text x="450" y="44" text-anchor="middle" class="mono" font-size="11" letter-spacing="3" fill="#5E7894">~/byteforge/signature</text>
    <text x="450" y="94" text-anchor="middle" class="sans" font-size="38" font-weight="800" letter-spacing="-0.8" fill="#EAF3FF">Byte<tspan fill="url(#forge)">Forge</tspan><tspan fill="#8FB0CE" font-weight="300"> Studio</tspan></text>
    <text x="450" y="130" text-anchor="middle" class="mono" font-size="13" letter-spacing="4" fill="#5E7894"><tspan fill="#21C7E8">DESIGN</tspan> · <tspan fill="#2ECFC2">DEVELOP</tspan> · <tspan fill="#21C7E8">BUILD</tspan> · <tspan fill="#FBC02D">EVOLVE</tspan></text>
    <text x="450" y="156" text-anchor="middle" class="sans" font-size="14" fill="#8CA3BD">Modern websites · Practical web systems · Professional digital experiences</text>
    <rect x="432" y="172" width="36" height="2" rx="1" fill="#FBC02D"/>
    <text x="450" y="195" text-anchor="middle" class="mono" font-size="12" fill="#B7CBE2">Built by Muhammad Affan<tspan fill="#21C7E8" class="blink">▌</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="none" stroke="#21C7E8" stroke-opacity="0.3"/>
</svg>
