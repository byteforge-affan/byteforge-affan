<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" class="sc-cyan" stop-opacity="0"/>
      <stop offset="0.28" class="sc-cyan"/>
      <stop offset="0.5" class="sc-teal"/>
      <stop offset="0.72" class="sc-cyan"/>
      <stop offset="1" class="sc-cyan" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
:root{--panel:#0B1A2E;--panel2:#10253F;--line:#22405F;--text:#EAF3FF;--text2:#B7CBE2;--muted:#7F98B4;--cyan:#21C7E8;--teal:#2ECFC2;--gold:#FBC02D;--ink:#07111F}
@media (prefers-color-scheme:light){:root{--panel:#F7FBFF;--panel2:#E7F2FB;--line:#BFD5E8;--text:#0B1F36;--text2:#33506D;--muted:#5C7691;--cyan:#0794B5;--teal:#0B9488;--gold:#B37A00;--ink:#FFFFFF}}
.mono{font-family:@MONO@}.sans{font-family:@SANS@}
.fpanel{fill:var(--panel)}.fpanel2{fill:var(--panel2)}.sline{stroke:var(--line)}
.ftext{fill:var(--text)}.ftext2{fill:var(--text2)}.fmuted{fill:var(--muted)}
.fcyan{fill:var(--cyan)}.fteal{fill:var(--teal)}.fgold{fill:var(--gold)}.fink{fill:var(--ink)}
.scyan{stroke:var(--cyan)}.steal{stroke:var(--teal)}.sgold{stroke:var(--gold)}
.sc-cyan{stop-color:var(--cyan)}.sc-teal{stop-color:var(--teal)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:flow 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}

  .gem{animation:pulse 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.gem{animation:none}}</style>
  <path d="M0 14H394M506 14H900" stroke="url(#fade)" stroke-width="1.5" fill="none"/>
  <path d="M20 11v6 M40 11v6 M60 11v6 M80 11v6 M100 8v12 M120 11v6 M140 11v6 M160 11v6 M180 11v6 M200 8v12 M220 11v6 M240 11v6 M260 11v6 M280 11v6 M300 8v12 M320 11v6 M340 11v6 M360 11v6 M380 11v6 M520 11v6 M540 11v6 M560 11v6 M580 11v6 M600 8v12 M620 11v6 M640 11v6 M660 11v6 M680 11v6 M700 8v12 M720 11v6 M740 11v6 M760 11v6 M780 11v6 M800 8v12 M820 11v6 M840 11v6 M860 11v6 M880 11v6" stroke="url(#fade)" stroke-width="1" stroke-opacity="0.6" fill="none"/>
  <path d="M418 8l-7 6 7 6M482 8l7 6-7 6" class="steal" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="446" y="10" width="8" height="8" transform="rotate(45 450 14)" class="fgold gem"/>
</svg>
